<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 274" width="728" height="274" role="img" aria-label="Ranked alternatives for the over-budget Hunza trip">
<style>.t{font:13px Helvetica,Arial,sans-serif;fill:#1b2a41}.h{font:700 13px Helvetica,Arial,sans-serif;fill:#fff}.ttl{font:700 19px Helvetica,Arial,sans-serif;fill:#1F3A5F}.sub{font:12px Helvetica,Arial,sans-serif;fill:#5b6b82}.neg{fill:#B3261E}.tot{font-weight:700}.row{opacity:0;animation:rowin 7.75s ease-out infinite}@keyframes rowin{0%{opacity:0;transform:translateX(-36px)}5%{opacity:1;transform:none}86%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateX(18px)}}.hl{animation:glow 3s ease-in-out infinite}@keyframes glow{0%,100%{opacity:.0}50%{opacity:.18}}</style>
<rect width="728" height="274" rx="12" fill="#F6F8FB" stroke="#C5CCD6"/>
<text class="ttl" x="18" y="30">Ranked alternatives for the over-budget Hunza trip</text><text class="sub" x="18" y="50">Budget PKR 150,000 - every alternative is fully recalculated and fits the budget</text>
<rect x="14" y="64" width="700" height="26" rx="6" fill="#1F3A5F"/>
<text class="h" x="24" y="83" text-anchor="start">#</text>
<text class="h" x="64" y="83" text-anchor="start">Alternative</text>
<text class="h" x="504" y="83" text-anchor="end">Complete cost</text>
<text class="h" x="624" y="83" text-anchor="end">Remaining</text>
<text class="h" x="704" y="83" text-anchor="end">Score</text>
<g class="row" style="animation-delay:0.35s"><rect x="14" y="94" width="700" height="28" rx="4" fill="#EEF2F7"/><text class="t" x="24" y="113" text-anchor="start">1</text><text class="t" x="64" y="113" text-anchor="start">Change destination to Murree</text><text class="t" x="504" y="113" text-anchor="end">PKR 134,200</text><text class="t" x="624" y="113" text-anchor="end">PKR 15,800</text><text class="t" x="704" y="113" text-anchor="end">0.7658</text></g>
<g class="row" style="animation-delay:0.70s"><rect x="14" y="124" width="700" height="28" rx="4" fill="#FFFFFF"/><text class="t" x="24" y="143" text-anchor="start">2</text><text class="t" x="64" y="143" text-anchor="start">Shorten trip to 2 days / 0 nights</text><text class="t" x="504" y="143" text-anchor="end">PKR 136,400</text><text class="t" x="624" y="143" text-anchor="end">PKR 13,600</text><text class="t" x="704" y="143" text-anchor="end">0.7436</text></g>
<g class="row" style="animation-delay:1.05s"><rect x="14" y="154" width="700" height="28" rx="4" fill="#EEF2F7"/><text class="t" x="24" y="173" text-anchor="start">3</text><text class="t" x="64" y="173" text-anchor="start">Shorten trip to 1 day / 1 night</text><text class="t" x="504" y="173" text-anchor="end">PKR 134,200</text><text class="t" x="624" y="173" text-anchor="end">PKR 15,800</text><text class="t" x="704" y="173" text-anchor="end">0.7058</text></g>
<g class="row" style="animation-delay:1.40s"><rect x="14" y="184" width="700" height="28" rx="4" fill="#FFFFFF"/><text class="t" x="24" y="203" text-anchor="start">4</text><text class="t" x="64" y="203" text-anchor="start">Reduce travellers to 1</text><text class="t" x="504" y="203" text-anchor="end">PKR 108,350</text><text class="t" x="624" y="203" text-anchor="end">PKR 41,650</text><text class="t" x="704" y="203" text-anchor="end">0.7042</text></g>
<g class="row" style="animation-delay:1.75s"><rect x="14" y="214" width="700" height="28" rx="4" fill="#EEF2F7"/><text class="t" x="24" y="233" text-anchor="start">5</text><text class="t" x="64" y="233" text-anchor="start">Change destination to Taxila</text><text class="t" x="504" y="233" text-anchor="end">PKR 123,200</text><text class="t" x="624" y="233" text-anchor="end">PKR 26,800</text><text class="t" x="704" y="233" text-anchor="end">0.7018</text></g>
</svg>