<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 698 274" width="698" height="274" role="img" aria-label="Monthly budget: planned vs actual">
<style>.t{font:13px Helvetica,Arial,sans-serif;fill:#1b2a41}.h{font:700 13px Helvetica,Arial,sans-serif;fill:#fff}.ttl{font:700 19px Helvetica,Arial,sans-serif;fill:#1F3A5F}.sub{font:12px Helvetica,Arial,sans-serif;fill:#5b6b82}.neg{fill:#B3261E}.tot{font-weight:700}.row{opacity:0;animation:rowin 7.75s ease-out infinite}@keyframes rowin{0%{opacity:0;transform:translateX(-36px)}5%{opacity:1;transform:none}86%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateX(18px)}}.hl{animation:glow 3s ease-in-out infinite}@keyframes glow{0%,100%{opacity:.0}50%{opacity:.18}}</style>
<rect width="698" height="274" rx="12" fill="#F6F8FB" stroke="#C5CCD6"/>
<text class="ttl" x="18" y="30">Monthly budget: planned vs actual</text><text class="sub" x="18" y="50">Home &amp; Kitchen, November 2026, available PKR 120,000</text>
<rect x="14" y="64" width="670" height="26" rx="6" fill="#1F3A5F"/>
<text class="h" x="24" y="83" text-anchor="start">Category</text>
<text class="h" x="394" y="83" text-anchor="end">Planned</text>
<text class="h" x="534" y="83" text-anchor="end">Actual</text>
<text class="h" x="674" y="83" text-anchor="end">Difference</text>
<g class="row" style="animation-delay:0.35s"><rect x="14" y="94" width="670" height="28" rx="4" fill="#EEF2F7"/><text class="t" x="24" y="113" text-anchor="start">Grocery</text><text class="t" x="394" y="113" text-anchor="end">PKR 30,000</text><text class="t" x="534" y="113" text-anchor="end">PKR 32,500</text><text class="t neg" x="674" y="113" text-anchor="end">-PKR 2,500</text></g>
<g class="row" style="animation-delay:0.70s"><rect x="14" y="124" width="670" height="28" rx="4" fill="#FFFFFF"/><text class="t" x="24" y="143" text-anchor="start">Electricity</text><text class="t" x="394" y="143" text-anchor="end">PKR 12,000</text><text class="t" x="534" y="143" text-anchor="end">PKR 14,200</text><text class="t neg" x="674" y="143" text-anchor="end">-PKR 2,200</text></g>
<g class="row" style="animation-delay:1.05s"><rect x="14" y="154" width="670" height="28" rx="4" fill="#EEF2F7"/><text class="t" x="24" y="173" text-anchor="start">Internet</text><text class="t" x="394" y="173" text-anchor="end">PKR 4,000</text><text class="t" x="534" y="173" text-anchor="end">PKR 4,000</text><text class="t" x="674" y="173" text-anchor="end">PKR 0</text></g>
<g class="row" style="animation-delay:1.40s"><rect x="14" y="184" width="670" height="28" rx="4" fill="#FFFFFF"/><text class="t" x="24" y="203" text-anchor="start">Rent</text><text class="t" x="394" y="203" text-anchor="end">PKR 50,000</text><text class="t" x="534" y="203" text-anchor="end">PKR 50,000</text><text class="t" x="674" y="203" text-anchor="end">PKR 0</text></g>
<g class="row" style="animation-delay:1.75s"><rect x="14" y="214" width="670" height="28" rx="4" fill="#EEF2F7"/><text class="t" x="24" y="233" text-anchor="start">Emergency Savings</text><text class="t" x="394" y="233" text-anchor="end">PKR 10,000</text><text class="t" x="534" y="233" text-anchor="end">PKR 0</text><text class="t" x="674" y="233" text-anchor="end">PKR 10,000</text></g>
</svg>